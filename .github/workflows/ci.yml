name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify calculator project exists
        run: |
          ls
          ls calculator

      - name: Run basic CI check
        run: |
          cd calculator
          echo "CI check passed for calculator project"
